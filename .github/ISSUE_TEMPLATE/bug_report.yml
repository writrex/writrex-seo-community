name: Bug report
description: Report a reproducible problem with Writrex SEO
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, payment details, personal data, private reports or security vulnerabilities. For a security concern, email hello@writrex.com with the subject "Writrex SEO security report".
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Enter...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: public-url
    attributes:
      label: Public webpage URL, if relevant
      description: Only public URLs. Do not include login-only or private URLs.
      placeholder: https://example.com/page
  - type: input
    id: observed-at
    attributes:
      label: Approximate date and time observed
      placeholder: 18 September 2026, 14:30 BST
  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop
        - Mobile
        - Tablet
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional context
      description: Remove confidential information before attaching anything.
